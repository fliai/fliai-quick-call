name: Linux check

# Build the Linux app and check it starts. Manual only (Actions tab > Linux check > Run workflow);
# it takes ~10 minutes, so it never runs on push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-start:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build dependencies, runtime and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential xvfb

      - run: npm ci

      - run: npx tauri build --no-bundle

      - name: Start it and check it keeps running
        run: |
          xvfb-run -a sh -c '
            ./src-tauri/target/release/fliai-quick-call > app.log 2>&1 &
            sleep 10
            if pgrep -f target/release/fliai-quick-call >/dev/null; then echo "App is running."; else echo "App exited:"; cat app.log; exit 1; fi
          '

      # Hover the island: its window must grow to the full open island, then shrink after leaving.
      - name: Hover opens the full island, leaving closes it
        run: |
          sudo apt-get install -y xdotool x11-utils
          pkill -f target/release/fliai-quick-call || true  # the start check's copy (single instance)
          sleep 1
          xvfb-run -a -s "-screen 0 1440x900x24" sh -ec '
            ./src-tauri/target/release/fliai-quick-call > app.log 2>&1 &
            sleep 8
            xwininfo -root -tree | head -30
            win=""
            for w in $(xdotool search --onlyvisible --class "fliai" 2>/dev/null); do
              xwininfo -id "$w" | grep -q IsViewable && [ "$(xwininfo -id "$w" | awk "/Width:/{print \$2}")" -gt 50 ] && win=$w
            done
            [ -n "$win" ] || { echo "No island window found."; cat app.log; exit 1; }
            size() { eval "$(xdotool getwindowgeometry --shell "$win")"; echo "$1: ${WIDTH}x${HEIGHT}"; }
            size closed
            xdotool mousemove 720 3; sleep 0.3; xdotool mousemove 721 4
            sleep 3; size open
            [ "$HEIGHT" -ge 150 ] || { echo "Open island is cropped."; cat app.log; exit 1; }
            xdotool mousemove 720 700
            sleep 3; size "after leaving"
            [ "$HEIGHT" -le 40 ] || { echo "Island did not close."; exit 1; }
          '
